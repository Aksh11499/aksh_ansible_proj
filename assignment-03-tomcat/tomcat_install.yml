---
- name: Install and Configure Tomcat
  hosts: appserver
  become: true
  gather_facts: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install Java
      apt:
        name: default-jdk
        state: present

    - name: Create Tomcat group
      group:
        name: tomcat
        state: present

    - name: Create Tomcat user
      user:
        name: tomcat
        group: tomcat
        shell: /bin/false
        create_home: false
        state: present

    - name: Create Tomcat installation directory
      file:
        path: /opt/tomcat
        state: directory
        owner: tomcat
        group: tomcat
        mode: '0755'

    - name: Download Tomcat
      get_url:
        url: https://dlcdn.apache.org/tomcat/tomcat-10/v10.1.57/bin/apache-tomcat-10.1.57.tar.gz
        dest: /tmp/apache-tomcat-10.1.57.tar.gz
        mode: '0644'

    - name: Extract Tomcat
      unarchive:
        src: /tmp/apache-tomcat-10.1.57.tar.gz
        dest: /opt/tomcat
        remote_src: true
        extra_opts:
          - --strip-components=1

    - name: Set Tomcat ownership
      file:
        path: /opt/tomcat
        owner: tomcat
        group: tomcat
        recurse: true

    - name: Change Tomcat port from 8080 to 9090
      replace:
        path: /opt/tomcat/conf/server.xml
        regexp: 'port="8080"'
        replace: 'port="9090"'

    - name: Copy Tomcat systemd service
      copy:
        src: tomcat.service
        dest: /etc/systemd/system/tomcat.service
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Start Tomcat
      systemd:
        name: tomcat
        state: started
        enabled: true

    - name: Wait for Tomcat port 9090
      wait_for:
        port: 9090
        host: 127.0.0.1
        timeout: 30

    - name: Verify Tomcat port
      shell: ss -lntp | grep ':9090'
      register: tomcat_port
      changed_when: false

    - name: Display Tomcat status
      debug:
        msg: "Tomcat is running on port 9090"
