# Main inventory used by Assignments 1-3.
# Replace the placeholder IP addresses with your actual server IPs.

[webserver]
web-01 ansible_host=<WEB01-IP>
web-02 ansible_host=<WEB02-IP>

[appserver]
app-01 ansible_host=<APP01-IP>
app-02 ansible_host=<APP02-IP>

[dbserver]
db-01 ansible_host=<DB01-IP>

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=/home/ubuntu/mykey.pem
